  :root {
    --paper:   #F4F4F0;  /* porcelain ground */
    --sumi:    #1B1A18;  /* ink */
    --sumi-soft:#565450; /* muted ink */
    --cobalt:  #22406E;  /* sometsuke blue (Arita underglaze) */
    --hair:    #d7d6cf;
    /* San Francisco via the system stack: real SF Pro on Apple devices, graceful fallback elsewhere */
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --serif: "Baskervville", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--sumi);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: grid;
    place-items: center;
    padding: 8vh 24px;
  }

  /* faint porcelain texture: two very soft radial washes */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(60% 50% at 50% 34%, rgba(34,64,110,0.045), transparent 70%),
      radial-gradient(70% 60% at 50% 100%, rgba(27,26,24,0.04), transparent 70%);
    pointer-events: none;
  }

  /* Aoi: seigaiha (青海波) — traditional Arita "blue sea wave" scales in sometsuke cobalt,
     breaking from the lower-left and fading up toward the top */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Cg%20fill='none'%20stroke='%23234C90'%20stroke-width='1'%20stroke-opacity='0.55'%3E%3Cpath%20d='M0%2040%20A20%2020%200%200%201%2040%2040'/%3E%3Cpath%20d='M6%2040%20A14%2014%200%200%201%2034%2040'/%3E%3Cpath%20d='M12%2040%20A8%208%200%200%201%2028%2040'/%3E%3Cpath%20d='M-20%2020%20A20%2020%200%200%201%2020%2020'/%3E%3Cpath%20d='M-14%2020%20A14%2014%200%200%201%2014%2020'/%3E%3Cpath%20d='M-8%2020%20A8%208%200%200%201%208%2020'/%3E%3Cpath%20d='M20%2020%20A20%2020%200%200%201%2060%2020'/%3E%3Cpath%20d='M26%2020%20A14%2014%200%200%201%2054%2020'/%3E%3Cpath%20d='M32%2020%20A8%208%200%200%201%2048%2020'/%3E%3C/g%3E%3C/svg%3E");
    background-size: 40px 40px;
    background-repeat: repeat;
    /* subtle audio-pressure rings emanating from a source in the lower-left, dissipating outward */
    -webkit-mask: radial-gradient(72% 80% at 0% 100%,
        rgba(0,0,0,0.5) 0 7%, rgba(0,0,0,0.12) 17%,
        rgba(0,0,0,0.44) 30%, rgba(0,0,0,0.1) 45%,
        rgba(0,0,0,0.36) 60%, rgba(0,0,0,0.08) 76%,
        transparent 92%);
            mask: radial-gradient(72% 80% at 0% 100%,
        rgba(0,0,0,0.5) 0 7%, rgba(0,0,0,0.12) 17%,
        rgba(0,0,0,0.44) 30%, rgba(0,0,0,0.1) 45%,
        rgba(0,0,0,0.36) 60%, rgba(0,0,0,0.08) 76%,
        transparent 92%);
  }

  .stage {
    z-index: 1;
    position: relative;
    text-align: center;
    max-width: 560px;
    width: 100%;
  }

  /* the mon stands on its own, as a kamon traditionally would */
  .crest {
    margin: 0 auto 36px;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: scale(0.94);
    animation: bloom 1.1s cubic-bezier(.2,.7,.2,1) 0.1s forwards;
  }
  .crest img, .crest svg {
    width: 128px;
    height: 128px;
    object-fit: contain;
    display: block;
  }

  .name {  /* CHANGE-ME (name): "Arita Industries" — or your final choice */
    font-weight: 300;
    font-size: clamp(40px, 9vw, 66px);
    line-height: 1.04;
    letter-spacing: 0.01em;
    color: var(--sumi);
    margin: 0;
    opacity: 0;
    animation: rise 1s ease 0.35s forwards;
  }

  /* clarifier line: which "Aoi" (碧 = azure / blue-green) + how to say it */
  .gloss {
    margin: 16px auto 0;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--sumi-soft);
    opacity: 0;
    animation: rise 1s ease 0.5s forwards;
  }
  .gloss .kanji { color: var(--cobalt); font-size: 15px; margin-right: 0.14em; }

  .descriptor {  /* CHANGE-ME (descriptor): keep it true and short */
    font-size: clamp(16px, 3.4vw, 19px);
    font-weight: 300;
    font-style: normal;
    color: var(--sumi-soft);
    margin: 30px auto 0;
    max-width: none;
    line-height: 1.5;
    opacity: 0;
    animation: rise 1s ease 0.6s forwards;
  }

  .contact {  /* CHANGE-ME (email) */
    display: inline-block;
    margin-top: 40px;
    font-family: var(--sans);
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--sumi);
    text-decoration: none;
    border-bottom: 1px solid var(--hair);
    padding-bottom: 3px;
    transition: border-color 0.25s ease, color 0.25s ease;
    opacity: 0;
    animation: rise 1s ease 0.8s forwards;
  }
  .contact:hover, .contact:focus-visible { color: var(--cobalt); border-color: var(--cobalt); }
  .contact:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 4px; border-radius: 2px; }

  @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes bloom { from { opacity: 0; transform: scale(0.94); }        to { opacity: 1; transform: scale(1); } }         to { opacity: 1; transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    .crest, .name, .gloss, .descriptor, .contact {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
